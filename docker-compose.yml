services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_music
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music_dev_password
    ports:
      - "5432:5432"
    volumes:
      - music_pgdata:/var/lib/postgresql/data

volumes:
  music_pgdata:
