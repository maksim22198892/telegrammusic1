services:
  - type: web
    name: telegram-music
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-music-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: telegram-music-db
    databaseName: telegram_music
    user: telegram_music
    plan: free
    region: frankfurt
